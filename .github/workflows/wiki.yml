name: Publish versioned Wiki pages

on:
  push:
    branches: [main]
    paths:
      - docs/wiki/**
      - .github/workflows/wiki.yml
      - Tools/sync-wiki.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labplus-wiki
  cancel-in-progress: false

jobs:
  sync-wiki:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Update managed Wiki pages without replacing other pages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & './Tools/sync-wiki.ps1' -Repository $env:GITHUB_REPOSITORY -SourceCommit $env:GITHUB_SHA

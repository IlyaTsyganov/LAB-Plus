name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-checks:
    name: Windows build and fixtures
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_UI_LANGUAGE: en
      LAB_LAYOUT_TEST_PATHS: ''

    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK x64
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga
          architecture: x64

      - name: Build the collision layer and native fixtures
        run: |
          & cmd /d /c '.\Native\CollisionViewer\build-viewer.cmd'
          if ($LASTEXITCODE -ne 0) { throw 'Collision layer or native fixture build failed.' }

      - name: Build the lighting layer
        run: |
          & '.\Native\Lighting\build.ps1'

      - name: Run native fixtures and verify suite coverage
        run: |
          & '.\Native\CollisionViewer\tests\run-fixtures.ps1'

      - name: Run update fixtures
        run: |
          & dotnet run --project 'Tests/Updates/Updates.Tests.csproj' --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Update fixtures failed.' }

      - name: Run launcher fixtures
        run: |
          & dotnet run --project 'Tests/Launcher/LauncherTests.csproj' --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Launcher fixtures failed.' }

      - name: Run screen state fixtures
        run: |
          & dotnet run --project 'Tests/ScreenState/ScreenState.Tests.csproj' --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Screen state fixtures failed.' }

      - name: Run HUD fixtures
        run: |
          & dotnet run --project 'Tests/Hud/Hud.Tests.csproj' --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'HUD fixtures failed.' }

      - name: Build and validate the runtime package
        run: |
          & dotnet publish 'labplus.csproj' --configuration Release --self-contained false `
            -p:PlatformTarget=x64 -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false `
            --output 'build/pr-checks'
          if ($LASTEXITCODE -ne 0) { throw 'Application publish failed.' }
          & '.\package-local.ps1' -Source (Join-Path $PWD 'build/pr-checks')

      - name: Summarize checks
        run: |
          @'
          Passed: native fixture coverage, native suites, update fixtures, launcher fixtures, screen state fixtures, HUD fixtures and runtime packaging.

          These checks use fixtures without a DOOM Eternal installation. Live game, visual UI and GPU acceptance remain separate checks.
          '@ >> $env:GITHUB_STEP_SUMMARY

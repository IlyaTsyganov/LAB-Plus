# One-time execution of the owner's request to describe the 1.0.2 changes.
# Targets only release 432095263 and immutable, hash-pinned text. This workflow
# is removed from main immediately after the result is verified.
name: Update 1.0.2 release notes once

on:
  push:
    branches: [main]
    paths: [.github/workflows/update-1.0.2-notes-once.yml]

permissions:
  contents: read

jobs:
  update:
    if: github.repository == 'IlyaTsyganov/LAB-Plus' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: f307346a03b46b473f597f55a6612150853a97ce
          persist-credentials: false
      - name: Update only the reviewed 1.0.2 release description
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $body = [IO.File]::ReadAllText((Join-Path $PWD 'docs/releases/1.0.2.md')).Replace("`r`n", "`n")
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($body))).ToLowerInvariant()
          if ($hash -cne 'c00be4513e67ac20d41a05fd494e9eae3f615dd6541e64414bcb0078e232295d') { throw 'Release description differs from reviewed text.' }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $url = 'https://api.github.com/repos/IlyaTsyganov/LAB-Plus/releases/432095263'
          $release = Invoke-RestMethod -Uri $url -Headers $headers
          if ($release.id -ne 432095263 -or $release.draft -or $release.tag_name -cne 'v1.0.2' -or
              $release.target_commitish -cne 'ddc9e3b77b2f3118354ccc8e6882fb58f18c6ba0' -or
              @($release.assets | Where-Object { $_.id -eq 703600939 -and $_.name -ceq 'labplus-1.0.2-win-x64.zip' -and $_.digest -ceq 'sha256:9300e7045376dcdba4637ef366358add495dbadff2d67bd03b4d0318a796ae2c' }).Count -ne 1) {
            throw 'Release or archive identity changed. No update performed.'
          }
          # The payload changes the description only; tags, assets, visibility,
          # repository settings and future releases are outside this operation.
          $payload = @{body = $body} | ConvertTo-Json -Compress
          $updated = Invoke-RestMethod -Method Patch -Uri $url -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($payload))
          if ($updated.id -ne 432095263 -or $updated.body -cne $body) { throw 'Description update was not verified.' }
          'Updated and verified the 1.0.2 description only.' >> $env:GITHUB_STEP_SUMMARY
